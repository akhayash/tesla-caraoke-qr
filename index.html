<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#05070a">
    <meta name="description" content="A private, browser-only QR reader for Tesla Caraoke passenger links.">
    <title>Tesla Caraoke QR Reader</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e31b23'/%3E%3Cpath fill='white' d='M14 14h16v16H14zm5 5v6h6v-6zm15-5h16v16H34zm5 5v6h6v-6zM14 34h16v16H14zm5 5v6h6v-6zm18-5h5v5h-5zm8 0h5v10h-5zm-11 8h8v8h-8zm11 5h5v3h-5z'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="app">
      <section class="intro" id="intro">
        <div class="brand" aria-hidden="true">QR</div>
        <h1>Tesla Caraoke<br>QR Reader</h1>
        <p class="subtitle">Scan the passenger app QR code with the cabin camera.</p>
        <button class="primary-button" id="scanButton" type="button">SCAN QR</button>
        <button class="secondary-button" id="uploadButton" type="button">Upload QR Image</button>
        <input id="fileInput" type="file" accept="image/*" hidden>
        <p class="parking-note">Camera access may only be available while the vehicle is in Park.</p>
      </section>

      <section class="scanner hidden" id="scanner" aria-live="polite">
        <div class="camera-stage">
          <video id="camera" autoplay muted playsinline></video>
          <div class="scan-shade" aria-hidden="true">
            <div class="scan-frame">
              <span></span><span></span><span></span><span></span>
            </div>
          </div>
        </div>
        <p class="instruction">Point the QR code at the cabin camera</p>
        <button class="secondary-button compact" id="cancelButton" type="button">Cancel</button>
      </section>

      <section class="result hidden" id="result" aria-live="assertive">
        <div class="status-icon" id="statusIcon" aria-hidden="true">✓</div>
        <h2 id="resultTitle">QR detected</h2>
        <p id="resultMessage"></p>
        <output class="detected-value" id="detectedValue"></output>
        <div class="result-actions">
          <button class="primary-button hidden" id="openButton" type="button">Open URL</button>
          <button class="secondary-button" id="scanAgainButton" type="button">Scan Again</button>
        </div>
      </section>

      <p class="error hidden" id="error" role="alert"></p>

      <footer>
        <button class="debug-toggle" id="debugButton" type="button" aria-expanded="false" aria-controls="debugPanel">Debug</button>
        <div class="debug-panel hidden" id="debugPanel">
          <dl>
            <div><dt>User Agent</dt><dd id="debugUserAgent"></dd></div>
            <div><dt>getUserMedia</dt><dd id="debugMedia"></dd></div>
            <div><dt>BarcodeDetector</dt><dd id="debugDetector"></dd></div>
            <div><dt>Decoder</dt><dd id="debugDecoder"></dd></div>
            <div><dt>Camera</dt><dd id="debugCamera"></dd></div>
            <div><dt>Detected data</dt><dd id="debugDetected"></dd></div>
          </dl>
        </div>
      </footer>
    </main>

    <canvas id="decodeCanvas" hidden></canvas>
    <script src="vendor/jsQR.js"></script>
    <script src="app.js"></script>
  </body>
</html>
